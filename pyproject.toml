[project]
name = "frontdesk-watch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.42.0",
  "python-dateutil>=2.9.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
frontdesk-watch = "frontdesk_watch:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["frontdesk_watch.py"]

